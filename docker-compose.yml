services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-invest-db
    environment:
      POSTGRES_USER: ai_invest
      POSTGRES_PASSWORD: ai_invest
      POSTGRES_DB: ai_invest
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_invest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
