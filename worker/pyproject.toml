[project]
name = "ai-invest-worker"
version = "0.1.0"
description = "Сборщики данных рынка РФ и генератор дайджестов"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "openai>=1.40",
]

[project.scripts]
ai-invest = "ai_invest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_invest"]
